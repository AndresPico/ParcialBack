name: labapp
description: "LabApp mobile marketplace frontend."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.12.0-261.0.dev

dependencies:
  flutter:
    sdk: flutter
  cached_network_image: any
  collection: any
  cupertino_icons: any
  dio: any
  flutter_riverpod: any
  flutter_secure_storage: any
  freezed_annotation: any
  go_router: any
  google_maps_flutter: any
  image_picker: any
  intl: any
  json_annotation: any
  permission_handler: any
  shimmer: any
  web_socket_channel: any

dev_dependencies:
  build_runner: any
  flutter_lints: any
  flutter_test:
    sdk: flutter
  freezed: any
  json_serializable: any

flutter:
  uses-material-design: true
